name: clusterix-stack

services:
  db:
    image: postgres:16-alpine
    container_name: clusterix-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: clusterix
      POSTGRES_USER: clusterix
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: clusterix-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Not secrets:
      BETTER_AUTH_URL: http://api:3000
      FRONTEND_ORIGIN: http://localhost:8080
      PORT: 3000
    secrets:
      - database_url
      - better_auth_secret
    ports:
      - "3000:3000"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    container_name: clusterix-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  better_auth_secret:
    file: ./secrets/better_auth_secret
