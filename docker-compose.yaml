name: clusterix-stack

services:
  db:
    image: postgres:16-alpine
    container_name: clusterix-db
    restart: unless-stopped
    env_file:
      - ./apps/api/.env.prod
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    networks:
      - backend

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: clusterix-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./apps/api/.env.prod
    ports:
      - "3000:3000"
    networks:
      - backend

  redis:
    image: redis:8.2.3-alpine
    container_name: clusterix-redis
    restart: unless-stopped
    env_file:
      - ./apps/api/.env.prod
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD not set}
    command:
      - sh
      - -c
      - >-
        redis-server --appendonly yes --save 60 1 --loglevel warning
        --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"
    networks:
      - backend

  web:
    env_file:
      - ./apps/api/.env.prod
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: clusterix-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    networks:
      - backend

volumes:
  db_data:
  redis_data:

networks:
  backend:
    driver: bridge
